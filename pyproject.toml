[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "open-slide-py"
version = "0.2.0"
description = "Python standard-library port of open-slide: JSON slide scenes to editable PPTX, SVG and offline HTML"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
open-slide-py = "open_slide_py.__main__:main"

[tool.setuptools]
packages = ["open_slide_py"]

[tool.setuptools.package-data]
open_slide_py = ["web/*.css", "web/*.js"]
